name: Simulador de Deploy e Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.env.example'
      - 'ACCESS_POLICY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '.env.example'
      - 'ACCESS_POLICY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Instalar Dependências
        run: npm install
        
      - name: Rodar Vite Build (Verifica Erros Ocultos de Compilação)
        run: npm run build
