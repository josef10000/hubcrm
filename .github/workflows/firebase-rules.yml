name: Deploy Regras de Seguranca Firestore

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'

env:
  # Garante compatibilidade com versões recentes do Node
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project gassistant-83242
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: gassistant-83242


